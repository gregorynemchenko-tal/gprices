name: Refresh official catalog
on:
  workflow_dispatch:
    inputs:
      import_prices:
        description: 'Also attempt the three legacy sources with restricted cloud connectivity'
        type: boolean
        default: false
      photo_batch:
        description: 'Number of retailer photo URLs to verify'
        type: choice
        options: ['0','250','2500']
        default: '2500'
  schedule:
    - cron: '27 */2 * * *'
permissions:
  contents: read
concurrency:
  group: catalog-import
  cancel-in-progress: false
env:
  SUPABASE_URL: https://simjxoshjprrexdixbso.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CATALOG_SERVICE_ROLE_KEY }}
  PYTHONUNBUFFERED: '1'
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chain: [keshet_teamim, rami_levy, osher_ad, yohananof, tiv_taam, freshmarket, shufersal, mahsanei_hashuk, super_bareket]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official branch prices and promotions
        run: python catalog_worker.py --chain "${{ matrix.chain }}" --max-jobs 1 --no-release
  publish:
    needs: prices
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PHOTO_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.photo_batch || '2500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish completed branches, preserving unavailable sources
        run: python catalog_worker.py --release-only
      - name: Prepare product photos
        if: env.PHOTO_BATCH != '0'
        run: python catalog_worker.py --retailer-images "$PHOTO_BATCH" --images 5 --release-only
      - name: Attempt legacy price sources
        if: github.event_name == 'workflow_dispatch' && inputs.import_prices
        run: |
          python catalog_worker.py --chain carrefour --max-jobs 1 --no-release
          python catalog_worker.py --chain victory --max-jobs 1 --no-release
          python catalog_worker.py --chain hazi_hinam --max-jobs 1
